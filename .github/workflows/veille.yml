name: Veille backend (keep-alive)

# Envoie une requête /api/health toutes les 10 minutes pour :
#  - maintenir le service Railway "éveillé" (pas de mise en veille par inactivité)
#  - vérifier que le backend répond et que la base de données est joignable
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appel /api/health
        id: ping
        run: |
          URL="https://chuchapp-backend-production.up.railway.app/api/health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 45 "$URL" || echo "000")
          echo "HTTP $code"
          cat /tmp/health.json || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "statut=OK" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "503" ]; then
            echo "statut=DEGRADE (base de donnees)" >> "$GITHUB_OUTPUT"
          else
            echo "statut=INJOIGNABLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Rapport dans le résumé du workflow
        if: always()
        run: |
          echo "## Veille backend — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP : \`${{ steps.ping.outputs.code }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Statut : **${{ steps.ping.outputs.statut }}**" >> "$GITHUB_STEP_SUMMARY"

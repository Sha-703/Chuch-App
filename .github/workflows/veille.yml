name: Veille backend (keep-alive)

# Envoie une requête /api/health toutes les 14 minutes pour :
#  - maintenir le service Render "éveillé" (mise en veille après 15 min d'inactivité)
#  - vérifier que le backend répond et que la base Neon est joignable
#
# ⚠️ Pourquoi 14 min et non 10 : chaque ping réveille Neon (scale-to-zero),
# qui reste actif 5 min après la dernière requête. Cadence de 14 min →
# le calcul Neon tourne ~36 % du temps ≈ 65 CU-heures/mois (quota gratuit : 100).
# Avec 10 min, on monterait à ~90 CU-h + trafic réel → risque de suspension.
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appel /api/health
        id: ping
        run: |
          URL="https://churchapp-backend.onrender.com/api/health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 45 "$URL" || echo "000")
          echo "HTTP $code"
          cat /tmp/health.json || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "statut=OK" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "503" ]; then
            echo "statut=DEGRADE (base de donnees)" >> "$GITHUB_OUTPUT"
          else
            echo "statut=INJOIGNABLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Rapport dans le résumé du workflow
        if: always()
        run: |
          echo "## Veille backend — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP : \`${{ steps.ping.outputs.code }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Statut : **${{ steps.ping.outputs.statut }}**" >> "$GITHUB_STEP_SUMMARY"
